<!doctype html><meta charset="utf-8">
<script type="importmap">{"imports":{
 "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
 "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// Bakes one KiCad GLB (or a tray STL) for the real-time hero scene: the cover-scene material rules
// (E:\qbit_review\cover_scene3d\scene.html, fixKicad) are applied here, hidden parts are dropped, everything
// that shares a material becomes ONE mesh (the station source has 53 000 primitives = 53 000 draw calls),
// vertices are welded and quantized (KHR_mesh_quantization). Units: mm, Y up, board centred on the origin.
//   ?name=station | tray30 | tray65 | <module name>      driven by bake.js
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const Q = new URLSearchParams(location.search), NAME = Q.get('name');
window.onerror = (m) => { window.DONE = 'ERR ' + m; };
const near = (c, r, g, b, e = 0.02) => Math.abs(c.r - r) < e && Math.abs(c.g - g) < e && Math.abs(c.b - b) < e;
const GOLD = { role: 'gold', color: [0.69, 0.47, 0.14], rough: 0.32, metal: 0.85 };
const HASL = { role: 'hasl', color: [0.72, 0.72, 0.72], rough: 0.32, metal: 0.85 };

const buckets = new Map();
function put(m, geo) { let b = buckets.get(m.role); if (!b) buckets.set(m.role, b = { m, geos: [] }); b.geos.push(geo); }

function grab(mesh) {                                  // world-space position + normal, non-indexed
  let g = mesh.geometry;
  if (!g.attributes.normal) { g = g.clone(); g.computeVertexNormals(); }
  let out = new THREE.BufferGeometry();
  out.setAttribute('position', g.attributes.position.clone()); out.setAttribute('normal', g.attributes.normal.clone());
  if (g.index) out.setIndex(g.index.clone());
  out.applyMatrix4(mesh.matrixWorld);
  if (out.index) out = out.toNonIndexed();
  if (mesh.matrixWorld.determinant() < 0) {             // mirrored part: restore the winding
    for (const a of [out.attributes.position, out.attributes.normal]) {
      const v = a.array;
      for (let i = 0; i < v.length; i += 9) for (let k = 0; k < 3; k++) { const t = v[i + 3 + k]; v[i + 3 + k] = v[i + 6 + k]; v[i + 6 + k] = t; }
    }
  }
  return out;
}
function refOf(o) { for (let p = o; p; p = p.parent) if (/^(CASE|[A-Z]+\d+)$/.test(p.name || '')) return p.name; return ''; }

function classify(mesh, kind, bb) {
  const mt = mesh.material, c = mt.color, ref = refOf(mesh);
  if (kind === 'module' && bb.max.y < 0.2) return null;                          // back of a module: inside its tray
  if (kind === 'station' && bb.max.y < 0.2 && !/^(J|SW|CASE)/.test(ref)) return null;   // station underside: inside the case (USB-C and the side buttons stay)
  if (mt.opacity < 1 && near(c, 0.765, 0.765, 0.76, 0.03)) return { role: 'mask', color: [0.80, 0.80, 0.79], rough: 0.5, metal: 0 };
  if (near(c, 0.42, 0.45, 0.29)) return { role: 'fr4', color: [0.70, 0.67, 0.55], rough: Math.max(0.42, mt.roughness ?? 0.6), metal: 0 };
  if (near(c, 0.5, 0.5, 0.5, 0.005)) return kind === 'station' ? GOLD : HASL;    // exposed copper
  if (near(c, 1, 1, 0) || near(c, 0.7, 0.61, 0)) return GOLD;                      // connector pins, ENIG pads
  if (near(c, 0.85, 0.85, 0.81)) return { role: 'case', color: [0.016, 0.017, 0.019], rough: 0.46, metal: 0 };
  if (near(c, 0.79, 0.87, 0.93)) return null;                                      // plain plate slab: the scene draws the real plate
  const rough = Math.min(1, Math.max(0.42, mt.roughness ?? 0.6));
  if (c.r < 0.06 && c.g < 0.06 && c.b < 0.06 && bb.max.y - bb.min.y < 0.05) return { role: 'silk', color: [c.r, c.g, c.b], rough, metal: 0 };
  const q = [c.r, c.g, c.b].map((v) => Math.round(v * 50) / 50);
  return { role: 'c' + q.map((v) => Math.round(v * 50)).join('_') + 'r' + Math.round(rough * 10), color: q, rough, metal: 0 };
}

// station: top copper and pads are only worth keeping where the white mask is open (the gold print, the port pads)
const isMask = (mt) => mt.opacity < 1 && near(mt.color, 0.765, 0.765, 0.76, 0.03);
const isLayerMetal = (c) => near(c, 0.5, 0.5, 0.5, 0.005) || near(c, 0.7, 0.61, 0);
function maskCover(meshes) {
  const tris = [], CELL = 4, grid = new Map();
  for (const m of meshes) {
    if (!isMask(m.material)) continue;
    const g = grab(m), p = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < p.length; i += 9) if (p[i + 1] > 1 && n[i + 1] > 0.5) tris.push([p[i], p[i + 2], p[i + 3], p[i + 5], p[i + 6], p[i + 8]]);
  }
  tris.forEach((t, k) => {
    const x0 = Math.floor(Math.min(t[0], t[2], t[4]) / CELL), x1 = Math.floor(Math.max(t[0], t[2], t[4]) / CELL);
    const z0 = Math.floor(Math.min(t[1], t[3], t[5]) / CELL), z1 = Math.floor(Math.max(t[1], t[3], t[5]) / CELL);
    for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) { const key = x + ',' + z; (grid.get(key) || grid.set(key, []).get(key)).push(k); }
  });
  const side = (px, pz, ax, az, bx, bz) => (px - bx) * (az - bz) - (ax - bx) * (pz - bz);
  return (x, z) => {
    const list = grid.get(Math.floor(x / CELL) + ',' + Math.floor(z / CELL)); if (!list) return false;
    for (const k of list) {
      const t = tris[k], d1 = side(x, z, t[0], t[1], t[2], t[3]), d2 = side(x, z, t[2], t[3], t[4], t[5]), d3 = side(x, z, t[4], t[5], t[0], t[1]);
      if (!((d1 < 0 || d2 < 0 || d3 < 0) && (d1 > 0 || d2 > 0 || d3 > 0))) return true;
    }
    return false;
  };
}
function underMask(g, covered) {                       // every sample of every top triangle lies under the mask
  const p = g.attributes.position.array;
  for (let i = 0; i < p.length; i += 9) {
    const ax = p[i], az = p[i + 2], bx = p[i + 3], bz = p[i + 5], cx = p[i + 6], cz = p[i + 8];
    const edge = Math.max(Math.hypot(bx - ax, bz - az), Math.hypot(cx - bx, cz - bz), Math.hypot(ax - cx, az - cz));
    const n = Math.min(60, Math.max(3, Math.ceil(edge / 0.3)));                  // barycentric grid, 0.3 mm
    for (let u = 0; u <= n; u++) for (let v = 0; v <= n - u; v++) {
      const a = (u + 0.2) / (n + 0.6), b = (v + 0.2) / (n + 0.6), c = 1 - a - b;
      if (!covered(ax * a + bx * b + cx * c, az * a + bz * b + cz * c)) return false;
    }
  }
  return true;
}
function split16(g) {                                  // more than 65 535 vertices: several meshes with 16-bit indices
  const idx = g.index.array, P = g.attributes.position.array, N = g.attributes.normal.array, parts = [];
  let map = new Map(), pos = [], nor = [], ind = [];
  const flush = () => {
    const o = new THREE.BufferGeometry();
    o.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3)); o.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(nor), 3));
    o.setIndex(new THREE.BufferAttribute(new Uint16Array(ind), 1)); parts.push(o); map = new Map(); pos = []; nor = []; ind = [];
  };
  for (let t = 0; t < idx.length; t += 3) {
    if (map.size > 65530) flush();
    for (let k = 0; k < 3; k++) {
      const v = idx[t + k]; let n = map.get(v);
      if (n === undefined) { n = map.size; map.set(v, n); pos.push(P[v * 3], P[v * 3 + 1], P[v * 3 + 2]); nor.push(N[v * 3], N[v * 3 + 1], N[v * 3 + 2]); }
      ind.push(n);
    }
  }
  flush(); return parts;
}

function quantize(g) {                                 // int16 positions (normalized, mesh scale restores mm), int8 normals
  g.computeBoundingBox();
  const c = g.boundingBox.getCenter(new THREE.Vector3()), sz = g.boundingBox.getSize(new THREE.Vector3());
  const h = Math.max(sz.x, sz.y, sz.z) / 2 || 1, p = g.attributes.position, n = g.attributes.normal;
  const qp = new Int16Array(p.count * 3), qn = new Int8Array(n.count * 3), C = [c.x, c.y, c.z];
  for (let i = 0; i < p.count * 3; i++) qp[i] = Math.round((p.array[i] - C[i % 3]) / h * 32767);
  for (let i = 0; i < n.count * 3; i++) qn[i] = Math.round(n.array[i] * 127);
  g.setAttribute('position', new THREE.BufferAttribute(qp, 3, true));
  g.setAttribute('normal', new THREE.BufferAttribute(qn, 3, true));
  if (p.count <= 65535) g.setIndex(new THREE.BufferAttribute(new Uint16Array(g.index.array), 1));
  return { c, h };
}

(async () => {
  const info = { name: NAME, roles: {} };
  if (NAME.startsWith('tray')) {                       // FDM tray, STL on the bed: PCB bottom at Z 1.2
    const geo = await new STLLoader().loadAsync(`/src/${NAME}.stl`);
    geo.rotateX(-Math.PI / 2); geo.translate(0, -1.2, 0); geo.computeVertexNormals();
    const g = new THREE.BufferGeometry(); g.setAttribute('position', geo.attributes.position); g.setAttribute('normal', geo.attributes.normal);
    put({ role: 'case', color: [0.016, 0.017, 0.019], rough: 0.46, metal: 0 }, g);
  } else {
    const kind = NAME === 'station' ? 'station' : 'module';
    const root = (await new GLTFLoader().loadAsync(`/src/${NAME}.glb`)).scene;
    root.scale.setScalar(1000); root.updateMatrixWorld(true);                    // KiCad GLB is in metres
    const meshes = []; root.traverse((m) => { if (m.isMesh) meshes.push(m); });
    info.source = meshes.length;
    let shift = new THREE.Vector3(-97.5, 8.4, -62.5);                             // station: board centre, case bottom on y = 0
    if (kind === 'module') {                             // board centre = the largest FR4-coloured mesh, PCB bottom on y = 0
      let best = null;
      for (const m of meshes) {
        if (!near(m.material.color, 0.42, 0.45, 0.29)) continue;
        const b = new THREE.Box3().setFromObject(m), a = (b.max.x - b.min.x) * (b.max.z - b.min.z);
        if (!best || a > best.a) best = { a, b };
      }
      const c = best.b.getCenter(new THREE.Vector3()), s = best.b.getSize(new THREE.Vector3());
      shift = new THREE.Vector3(-c.x, 0, -c.z); info.board = [s.x, s.y, s.z].map((v) => +v.toFixed(2));
    }
    const box = new THREE.Box3(), covered = kind === 'station' ? maskCover(meshes) : null;
    let masked = 0;
    for (const m of meshes) {
      m.geometry.computeBoundingBox(); box.copy(m.geometry.boundingBox).applyMatrix4(m.matrixWorld);
      const cls = classify(m, kind, box);
      if (!cls) continue;
      const g = grab(m);
      if (covered && isLayerMetal(m.material.color) && box.min.y > 1 && underMask(g, covered)) { masked++; continue; }
      g.translate(shift.x, shift.y, shift.z); put(cls, g);
    }
    info.masked = masked;
  }
  const out = new THREE.Scene(); let tris = 0, verts = 0;
  for (const [role, b] of buckets) {
    const whole = mergeVertices(mergeGeometries(b.geos, false), 1e-3);
    const t = whole.index.count / 3, v = whole.attributes.position.count; tris += t; verts += v; info.roles[role] = [t, v];
    const mat = new THREE.MeshStandardMaterial({ roughness: b.m.rough, metalness: b.m.metal, side: THREE.DoubleSide });   // KiCad sheets (mask, silk) have no reliable winding
    mat.color.setRGB(...b.m.color); mat.name = role;
    for (const g of (v > 65535 ? split16(whole) : [whole])) {
      const { c, h } = quantize(g), mesh = new THREE.Mesh(g, mat);
      mesh.name = role; mesh.position.copy(c); mesh.scale.setScalar(h); out.add(mesh);
    }
  }
  info.tris = tris; info.verts = verts; info.meshes = buckets.size;
  const buf = await new GLTFExporter().parseAsync(out, { binary: true });
  const back = (await new GLTFLoader().parseAsync(buf.slice(0), '')).scene; back.updateMatrixWorld(true);   // read it back: size check
  const bb = new THREE.Box3().setFromObject(back);
  info.bytes = buf.byteLength; info.bbox = [...bb.min.toArray(), ...bb.max.toArray()].map((v) => +v.toFixed(2));
  const u8 = new Uint8Array(buf); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  window.OUT = btoa(s); window.INFO = JSON.stringify(info); window.DONE = 'ok';
})().catch((e) => { window.DONE = 'ERR ' + (e && e.stack || e); });
</script>
