<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07101f">
<title>q.bit — симулятор платы</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='3' width='26' height='26' rx='7' fill='%2319c3ff'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='%23072046'%3EQ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- gradients and filters shared by every SVG on the page -->
<svg id="svg-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"></svg>

<div id="app" class="app">
  <header class="topbar" id="topbar">
    <button class="icon-btn only-narrow" id="btn-tray" aria-label="Список модулей" title="Модули"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="url(#g-brand)"/><path d="M8 10h3M21 10h3M8 22h3M21 22h3" stroke="#fff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"/><text x="16" y="21.5" font-size="16" font-weight="800" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif">Q</text></svg>
      <div class="brand-text"><b>q.bit</b><span>симулятор платы</span></div>
    </div>
    <div class="spacer"></div>
    <div class="seg" id="kit-seg" role="group" aria-label="Комплект"></div>
    <label class="field" title="Что подключено к USB-C">
      <span class="field-icon"><svg class="ic"><use href="#i-bolt"/></svg></span>
      <select id="sel-source" aria-label="Питание"></select>
    </label>
    <button class="btn" id="btn-demo" title="Входы управляют выходами, пока нет блочных программ" aria-pressed="false"><svg class="ic"><use href="#i-play"/></svg> <span>Демо</span></button>
    <button class="icon-btn" id="btn-sound" aria-label="Звук" title="Звук"><svg class="ic"><use href="#i-sound-on"/></svg></button>
    <button class="icon-btn" id="btn-menu" aria-label="Меню" title="Меню"><svg class="ic"><use href="#i-dots"/></svg></button>
    <button class="icon-btn only-narrow" id="btn-side" aria-label="Панель" title="Панель"><svg class="ic"><use href="#i-panel"/></svg></button>
  </header>

  <aside class="tray" id="tray" aria-label="Модули"></aside>

  <main class="stage" id="stage">
    <div class="board-wrap" id="board-wrap">
      <svg id="board-svg" class="board-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Плата q.bit, вид сверху"></svg>
      <div class="hint" id="hint"></div>
    </div>
    <div class="hud" id="hud"></div>
  </main>

  <aside class="side" id="side" aria-label="Инспектор"></aside>

  <section class="console" id="console" aria-label="Консоль платы"></section>
</div>

<!-- the module that follows the pointer while it is being dragged lives here (above every panel) -->
<svg id="drag-svg" class="drag-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g id="drag-root"></g></svg>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="menu" class="menu" hidden></div>
<div class="scrim" id="scrim" hidden></div>

<script src="js/core/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/uz.js"></script>
<script src="js/data/hw-data.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/passport.js"></script>
<script src="js/core/env.js"></script>
<script src="js/core/power.js"></script>
<script src="js/core/module.js"></script>
<script src="js/core/font5x7.js"></script>
<script src="js/core/board.js"></script>
<script src="js/core/modules/_common.js"></script>
<script src="js/core/modules/inputs.js"></script>
<script src="js/core/modules/outputs.js"></script>
<script src="js/core/modules/i2c.js"></script>
<script src="js/core/modules/chips.js"></script>
<script src="js/core/modules/oled.js"></script>
<script src="js/core/modules/misc.js"></script>
<script src="js/core/demo.js"></script>
<script src="js/runtime/pyinterp.js"></script>
<script src="js/runtime/spec.js"></script>
<script src="js/runtime/contract.js"></script>
<script src="js/runtime/runtime.js"></script>
<script src="js/ui/svgkit.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/faces/base.js"></script>
<script src="js/ui/faces/input.js"></script>
<script src="js/ui/faces/output.js"></script>
<script src="js/ui/faces/sensor.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/board-view.js"></script>
<script src="js/ui/tray.js"></script>
<script src="js/ui/widgets.js"></script>
<script src="js/ui/inspector.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/console.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
