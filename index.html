<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22a4ff">
<title>qblock — блочное программирование для q.bit</title>
<meta name="description" content="Блочное программирование для платы q.bit: соберите программу из блоков и запустите её на симуляторе или на настоящей плате.">
<meta property="og:type" content="website">
<meta property="og:title" content="qblock — блочное программирование для q.bit">
<meta property="og:description" content="Блоки, Python и симулятор платы q.bit прямо в браузере.">
<meta property="og:image" content="https://javohir-g.github.io/qbit-ide/img/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="img/qbit-robot.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/ide.css">
</head>
<body class="ide-page">

<svg id="svg-defs" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute"></svg>

<div id="ide" class="ide">
  <!-- ============================================================ top bar -->
  <header class="ide-top">
    <div class="brand" title="qblock · q.bit">
      <img class="brand-logo" src="img/qblock-logo.png" alt="q.block" width="390" height="96">
    </div>
    <button class="top-link" id="btn-file" aria-haspopup="menu">
      <svg class="ic"><use href="#i-file"/></svg><span>Файл</span><svg class="ic caret"><use href="#i-chevron"/></svg>
    </button>
    <div class="proj-pill">
      <input id="project-name" type="text" value="Новый проект" maxlength="60" placeholder="Название проекта" aria-label="Название проекта" spellcheck="false">
      <button class="pill-btn" id="btn-save" title="Сохранить проект в файл" aria-label="Сохранить"><svg class="ic"><use href="#i-save"/></svg></button>
    </div>

    <div class="spacer"></div>
    <button class="top-icon only-narrow" id="btn-board" aria-label="Плата" title="Плата и консоль" aria-pressed="false"><svg class="ic"><use href="#i-board"/></svg></button>
    <button class="top-link" id="btn-lang" title="Язык интерфейса" aria-haspopup="menu"><svg class="ic"><use href="#i-globe"/></svg><span id="lang-short">RU</span><svg class="ic caret"><use href="#i-chevron"/></svg></button>
    <button class="top-icon" id="btn-sound" data-keep="1" aria-label="Звук" title="Звук" aria-pressed="true"><svg class="ic snd-on"><use href="#i-sound-on"/></svg><svg class="ic snd-off"><use href="#i-sound-off"/></svg></button>
  </header>

  <div class="ide-body" id="ide-body">
    <!-- ============================================================ left: the board and its tools -->
    <aside class="ide-right" id="ide-right" aria-label="Плата">
      <div class="ctl-row">
        <button class="connect-pill" id="btn-target" title="Где запускается программа">
          <svg class="ic"><use href="#i-plug"/></svg><span id="target-name">Подключить</span>
        </button>
        <div class="spacer"></div>
        <button class="round pause" id="btn-pause" title="Приостановить программу" aria-label="Пауза" disabled><svg class="ic"><use href="#i-pause"/></svg></button>
        <button class="round stop" id="btn-stop" title="Остановить программу (Esc)" aria-label="Стоп" disabled><svg class="ic"><use href="#i-stop"/></svg></button>
        <button class="round run" id="btn-run" title="Запустить программу (Ctrl+Enter)" aria-label="Запустить"><svg class="ic"><use href="#i-play"/></svg></button>
      </div>

      <div class="left-card">
        <div class="right-head">
          <div class="ide-status" id="run-status" aria-live="polite"><i class="dot"></i><span>Готов</span></div>
          <span class="ide-batt" id="top-batt" title="Заряд батареи платы"><svg class="ic bolt"><use href="#i-bolt"/></svg><svg class="batt" viewBox="0 0 24 14" aria-hidden="true"><rect x="1" y="1.5" width="19" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="21" y="5" width="2" height="4" rx="1" fill="currentColor"/><rect id="top-batt-fill" x="3" y="3.5" width="15" height="7" rx="1.2" fill="currentColor"/></svg><b id="top-batt-text">—</b></span>
        </div>
        <div class="board-wrap" id="board-wrap">
          <svg id="board-svg" class="board-svg" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Плата q.bit, вид сверху"></svg>
          <div class="hint" id="hint"></div>
        </div>
        <div class="left-tabs" role="tablist">
          <button id="btab-console" role="tab" aria-selected="true">Консоль</button>
          <button id="btab-modules" role="tab" aria-selected="false">Модули</button>
          <button id="btab-props" role="tab" aria-selected="false">Свойства</button>
          <button id="btab-data" role="tab" aria-selected="false">Данные</button>
          <button id="btab-devices" role="tab" aria-selected="false">Устройства</button>
        </div>
        <div class="left-panes">
          <div class="pane" id="pane-console"></div>
          <div class="pane" id="tray" aria-label="Модули" hidden></div>
          <div class="pane side" id="side" aria-label="Свойства" hidden></div>
          <div class="pane" id="pane-data" hidden></div>
          <div class="pane" id="pane-devices" hidden>
            <div class="devices-grid">
              <div id="device-list"></div>
              <label class="field" title="Что подключено к USB-C (в симуляторе)"><svg class="ic"><use href="#i-bolt"/></svg><select id="sel-source" aria-label="Питание"></select></label>
              <div><div class="hud" id="hud"></div></div>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ============================================================ editor -->
    <main class="ide-main" id="ide-main">
      <div class="work-card ide-editor" id="ide-editor">
        <div id="blockly-div" class="blockly-host"></div>
        <div id="code-view" class="code-view" hidden></div>
        <div class="mode-pills" role="tablist" aria-label="Режим редактора">
          <button id="tab-blocks" role="tab" aria-selected="true">Блоки</button>
          <button id="tab-python" role="tab" aria-selected="false">Python</button>
        </div>
        <!-- on a phone the board sits in a sheet over the editor: Run and Stop are also here -->
        <div class="ed-run" id="ed-run">
          <button class="round run" id="btn-run2" title="Запустить программу" aria-label="Запустить"><svg class="ic"><use href="#i-play"/></svg></button>
          <button class="round stop" id="btn-stop2" title="Остановить программу" aria-label="Стоп" disabled><svg class="ic"><use href="#i-stop"/></svg></button>
        </div>
        <!-- an empty project: where to start -->
        <div class="start-cards" id="start-cards" hidden>
          <div class="start-title">Начните с примера</div>
          <div class="start-list" id="start-list"></div>
        </div>
        <!-- block search: the round button under the categories opens the field next to it -->
        <button class="find-btn" id="btn-find" title="Поиск блоков" aria-label="Поиск блоков" aria-expanded="false" aria-controls="find-pop"><svg class="ic"><use href="#i-search"/></svg></button>
        <div class="find-pop" id="find-pop" hidden>
          <svg class="ic"><use href="#i-search"/></svg>
          <input id="block-search" type="search" placeholder="Поиск блоков" autocomplete="off" aria-label="Поиск блоков">
          <button class="find-x" id="find-close" type="button" title="Закрыть поиск" aria-label="Закрыть поиск"><svg class="ic"><use href="#i-x"/></svg></button>
        </div>
      </div>
    </main>
  </div>
</div>

<svg id="drag-svg" class="drag-svg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><g id="drag-root"></g></svg>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="menu" class="menu" hidden></div>
<div class="scrim" id="scrim" hidden></div>

<script>window.QBIT_NO_AUTOBOOT = true;</script>
<script src="vendor/blockly/blockly_compressed.js"></script>
<script src="vendor/blockly/blocks_compressed.js"></script>
<script src="vendor/blockly/python_compressed.js"></script>
<script src="vendor/blockly/msg/ru.js"></script>
<script src="js/core/i18n.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/uz.js"></script>
<script src="js/data/hw-data.js"></script>
<script src="js/core/util.js"></script>
<script src="js/core/passport.js"></script>
<script src="js/core/env.js"></script>
<script src="js/core/power.js"></script>
<script src="js/core/module.js"></script>
<script src="js/core/font5x7.js"></script>
<script src="js/core/board.js"></script>
<script src="js/core/modules/_common.js"></script>
<script src="js/core/modules/inputs.js"></script>
<script src="js/core/modules/outputs.js"></script>
<script src="js/core/modules/i2c.js"></script>
<script src="js/core/modules/chips.js"></script>
<script src="js/core/modules/oled.js"></script>
<script src="js/core/modules/misc.js"></script>
<script src="js/core/demo.js"></script>
<script src="js/runtime/pyinterp.js"></script>
<script src="js/runtime/spec.js"></script>
<script src="js/runtime/contract.js"></script>
<script src="js/runtime/runtime.js"></script>
<script src="js/ui/svgkit.js"></script>
<script src="js/ui/icons.js"></script>
<script src="js/ui/faces/base.js"></script>
<script src="js/ui/faces/input.js"></script>
<script src="js/ui/faces/output.js"></script>
<script src="js/ui/faces/sensor.js"></script>
<script src="js/ui/audio.js"></script>
<script src="js/ui/board-view.js"></script>
<script src="js/ui/tray.js"></script>
<script src="js/ui/widgets.js"></script>
<script src="js/ui/inspector.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/console.js"></script>
<script src="js/ui/app.js"></script>
<script src="js/ide/catalog.js"></script>
<script src="js/ide/blocks.js"></script>
<script src="js/ide/toolbox.js"></script>
<script src="js/ide/sounds.js"></script>
<script src="js/ide/editor.js"></script>
<script src="js/ide/device.js"></script>
<script src="js/ide/link.js"></script>
<script src="js/ide/panes.js"></script>
<script src="js/ide/examples.js"></script>
<script src="js/ide/ide.js"></script>
<script>
/* offline and install: the manifest and the service worker belong to http(s) pages (a page opened from a file has neither: a file:// manifest is an error);
   the worker only on https (GitHub Pages) or localhost, never on the board's own http address */
if (/^https?:$/.test(location.protocol)) {
  var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf);
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () { /* works without it */ }); });
}
</script>
</body>
</html>
